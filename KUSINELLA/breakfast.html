<!DOCTYPE html>
<html>

    <title>What food would you like?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1> The Kusinella Food Assigner </h1>

  <p>What flavor do you prefer?</p>

  <style>
    .enlarge {
        transform: scale(1.2); /* Increase the size of the image */
        transition: transform 0.3s; /* Add a smooth transition effect */
    }
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){
        $('img').hover(function(){
            $(this).addClass('enlarge');
        }, function(){
            $(this).removeClass('enlarge');
        });
    });
</script>


<div class="row">
    <div class="x">
    <a href="kusinella_recipe.html"><img src="img/Longsilog.png" alt="longsilog"></a>
    <p>Sweet?</p>

    <a href="kusinella_recipe.html"><img src="img/torta.png" alt="tortang talong"></a>
    <p>Salty?</p>

    <a href="kusinella_recipe_sinangag.html"><img src="img/sinangag.png" alt="sinangag"></a>
    <p>Mild?</p>
    </div>

</div>
<script>

    document.addEventListener("DOMContentLoaded", function() {
    const elements = document.querySelectorAll("*");
    elements.forEach(element => {
        element.style.transition = "opacity 4s";
        element.style.opacity = 0;
    });
  
    setTimeout(() => {
        elements.forEach(element => {
            element.style.opacity = 1;
        });
    }, 100);
  });
  </script> 
</body>
