<form id="searchForm" action="/search" method="get">
    <input type="text" id="searchInput" name="q" placeholder="Search...">

  <script>
    document.getElementById("searchForm").addEventListener("submit", function(event) {
      event.preventDefault(); 
      
      let input = document.getElementById("searchInput").value;
      
      switch(input.toLowerCase()) {
        case "longsilog":
          window.location.href = "kusinella_recipe_longsilog.html";
          break;
        case "tortang talong":
          window.location.href = "kusinella_recipe_torta.html";
          break;
        case "sinangag":
          window.location.href = "kusinella_recipe_sinangag.html";
          break;
        case "corned beef":
          window.location.href = "kusinella_recipe_sinangag.html";
          break;
        case "corned beef sinangag":
          window.location.href = "kusinella_recipe_sinangag.html";
          break;
        case "sinigang":
          window.location.href = "kusinella_recipe_sinigang.html";
          break;
        case "adobong pusit":
          window.location.href = "kusinella_recipe_adobo.html";
          break;
        case "inasal":
          window.location.href = "kusinella_recipe_inasal.html";
          break;
        case "champorado":
          window.location.href = "kusinella_recipe_champorado.html";
          break;
        case "mango graham":
          window.location.href = "kusinella_recipe_mangograham.html";
          break;
        case "fishball mix":
          window.location.href = "kusinella_recipe_fskball.html";
          break;
        case "fishballs":
          window.location.href = "kusinella_recipe_fskball.html";
          break;
        case "squidballs":
          window.location.href = "kusinella_recipe_fskball.html";
          break;
        case "kikiam":
          window.location.href = "kusinella_recipe_fskball.html";
          break;
        case "breakfast":
          window.location.href = "breakfast.html"
          break;
        case "lunch":
          window.location.href = "lunch.html"
          break;
        case "dinner":
          window.location.href = "lunch.html"
          break;
        case "dessert":
          window.location.href = "dessert.html"
          break;
        case "snacks":
          window.location.href = "dessert.html"
          break;
        case "snack":
          window.location.href = "dessert.html"
          break;
        default:
          window.location.href = "kusinella.html";
      }
    });
    </script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
  const elements = document.querySelectorAll("*");
  elements.forEach(element => {
      element.style.transition = "opacity 4s";
      element.style.opacity = 0;
  });

  setTimeout(() => {
      elements.forEach(element => {
          element.style.opacity = 1;
      });
  }, 100);
});
</script>
