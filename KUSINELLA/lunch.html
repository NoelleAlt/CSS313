<!DOCTYPE html>
<html>
<head>
    <title>What food would you like?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1> Lunches/Dinners</h1>

  <style>
    .enlarge {
        transform: scale(1.2); 
        transition: transform 0.3s; 
    }
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){
        $('img').hover(function(){
            $(this).addClass('enlarge');
        }, function(){
            $(this).removeClass('enlarge');
        });
    });
</script>


<div class="row">
    <div class="x">
        <input type="radio" name="option" value="1">
        <img src="img/sinigang1.png" alt="Image 1"></a>
        <p>Sinigang</p>

        <input type="radio" name="option" value="2">
        <img src="img/Adobo.png" alt="Image 1"></a>
        <p>Adobong Pusit</p>

        <input type="radio" name="option" value="3">
        <img src="img/inasal.png" alt="Image 1"></a>
        <p>Inasal</p>

        <button onclick="redirect()">Submit</button>

    </div>
    
</div>



<script>
    function redirect() {
        let option = document.querySelector('input[name="option"]:checked').value;

        switch(option) {
            case '1':
                window.location.href = 'kusinella_recipe_sinigang.html';
                break;
            case '2':
                window.location.href = 'kusinella_recipe_adobo.html';
                break;
            case '3':
                window.location.href = 'kusinella_recipe_inasal.html';
                break;
            default:
                alert('Please select an option.');
        }
    }
</script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
    const elements = document.querySelectorAll("*");
    elements.forEach(element => {
        element.style.transition = "opacity 2s";
        element.style.opacity = 0;
    });
  
    setTimeout(() => {
        elements.forEach(element => {
            element.style.opacity = 1;
        });
    }, 100);
  });
  </script>
  
    
</body>

<footer>
    <div class="x">
<p><a href="kusinella.html">Go back to the main page</a></p>
    </div>    
</footer>

</html>
