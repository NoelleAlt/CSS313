<!DOCTYPE html>
<html>
<head>
    <title>What food would you like?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1> The Kusinella Food Assigner </h1>

  <p> What will the meal be for? </p>

  <style>
    .enlarge {
        transform: scale(1.2); /* Increase the size of the image */
        transition: transform 0.3s; /* Add a smooth transition effect */
    }
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){
        $('img').hover(function(){
            $(this).addClass('enlarge');
        }, function(){
            $(this).removeClass('enlarge');
        });
    });
</script>


<div class="row">
    <div class="x">
    <a href="breakfast.html"><img src="img/Longsilog.png" alt="breakfast"></a>
    <p>Breakfast?</p>

    <a href="lunch.html"><img src="img/sinigang1.png" alt="Image 1"></a>
    <p>Lunch/Dinner?</p>

    <a href="dessert.html"><img src="img/mango-graham.png" alt="Image 1"></a>
    <p>Dessert/Snack?</p>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
    const elements = document.querySelectorAll("*");
    elements.forEach(element => {
        element.style.transition = "opacity 2s";
        element.style.opacity = 0;
    });
  
    setTimeout(() => {
        elements.forEach(element => {
            element.style.opacity = 1;
        });
    }, 100);
  });
  </script>
  
    
</body>
