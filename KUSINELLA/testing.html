<!DOCTYPE html>
<html>
<head>
    <title>What food would you like?</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1> The Kusinella Food Assigner </h1>

  <p> What will the meal be for? </p>

  <style>
    .enlarge {
        transform: scale(1.2); /* Increase the size of the image */
        transition: transform 0.3s; /* Add a smooth transition effect */
    }
</style>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function(){
        $('img').hover(function(){
            $(this).addClass('enlarge');
        }, function(){
            $(this).removeClass('enlarge');
        });
    });
</script>


<div class="row">
    <div class="x">
        <input type="radio" name="option" value="1">
        <img src="img/Longsilog.png" alt="breakfast"></a>
        <p>Breakfast?</p>

        <input type="radio" name="option" value="2">
        <img src="img/sinigang1.png" alt="lunch/dinner"></a>
        <p>Lunch/Dinner?</p>

        <input type="radio" name="option" value="3">
        <img src="img/mango-graham.png" alt="snacks/dessert"></a>
        <p>Dessert/Snack?</p>

        <button onclick="redirect()">Submit</button>

    </div>
    
</div>

<script>
    function redirect() {
        let option = document.querySelector('input[name="option"]:checked').value;

        switch(option) {
            case '1':
                window.location.href = 'breakfast.html';
                break;
            case '2':
                window.location.href = 'lunch.html';
                break;
            case '3':
                window.location.href = 'dessert.html';
                break;
            default:
                alert('Please select an option.');
        }
    }
</script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
    const elements = document.querySelectorAll("*");
    elements.forEach(element => {
        element.style.transition = "opacity 2s";
        element.style.opacity = 0;
    });
  
    setTimeout(() => {
        elements.forEach(element => {
            element.style.opacity = 1;
        });
    }, 100);
  });
  </script>
  
    
</body>

<footer>
    <div class="x">
<p><a href="kusinella.html">Go back to the main page</a></p>
    </div>    
</footer>

</html>
